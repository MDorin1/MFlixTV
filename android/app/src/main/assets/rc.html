<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0a0d">
<meta name="robots" content="noindex,nofollow">
<title>遥控器 - MFlixTV</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#0a0a0d;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  body{min-height:100dvh;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden}
  button{font-family:inherit;border:0;background:none;color:#fff;cursor:pointer;user-select:none;
    -webkit-user-select:none;-webkit-transition:background .12s,transform .08s;transition:background .12s,transform .08s}
  .b{background:rgba(255,255,255,.06);border-radius:12px;display:-webkit-flex;display:flex;
    -webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
  .b:active{background:rgba(255,255,255,.22)}
  .b.on{background:#fff;color:#0a0a0d}

  .top{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:8px;padding:14px 16px 8px}
  .dot{width:8px;height:8px;border-radius:50%;background:#34d399;-webkit-flex:none;flex:none}
  .dot.off{background:#ef4444}
  .who{-webkit-flex:1;flex:1;min-width:0}
  .who b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who span{display:block;font-size:11px;color:rgba(255,255,255,.45);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who span.bad{color:rgba(248,113,113,.9)}
  .vib{-webkit-flex:none;flex:none;border:0;background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);
    border-radius:8px;padding:6px 10px;font-size:11px}
  .vib:active{background:rgba(255,255,255,.2)}

  .card{margin:0 16px 10px;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px}
  .trow{display:-webkit-flex;display:flex;-webkit-align-items:flex-start;align-items:flex-start}
  .tmain{-webkit-flex:1;flex:1;min-width:0}
  .title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .subline{font-size:10.5px;color:rgba(255,255,255,.4);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini{-webkit-flex:none;flex:none;height:28px;padding:0 8px;margin-left:6px;border-radius:8px;
    background:rgba(255,255,255,.06);font-size:11px;white-space:nowrap}
  .mini:active{background:rgba(255,255,255,.22)}
  .mini.dim{opacity:.35}
  .bar{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;font-size:11px;
    color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums}
  .bar input[type=range]{-webkit-flex:1;flex:1;margin:0 8px;accent-color:#fff;height:24px}
  .stat{font-size:10.5px;color:rgba(255,255,255,.42);margin-top:5px;font-variant-numeric:tabular-nums}
  .stat i{font-style:normal;color:rgba(52,211,153,.85)}
  .stat b{font-weight:600;color:rgba(248,113,113,.9)}
  .stat u{text-decoration:none;color:rgba(255,255,255,.2);margin:0 4px}

  .row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;
    -webkit-justify-content:center;justify-content:center;gap:12px;padding:0 16px}
  .b14{width:56px;height:56px}
  .play{width:80px;height:80px;border-radius:50%;background:#fff;color:#000;
    display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
  .play:active{transform:scale(.95)}

  .chips{display:-webkit-flex;display:flex;gap:10px;-webkit-justify-content:center;justify-content:center;
    margin-top:12px;padding:0 16px;font-size:12px}
  .chips .b{height:44px;padding:0 14px;-webkit-flex:1;flex:1}
  .chips .b.dim{opacity:.4}

  /* 十字键 + 竖音量条：音量条就在上下左右的右边，跟苹果手机的音量键一样往上拖变大声 */
  .padwrap{display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center;
    -webkit-align-items:flex-start;align-items:flex-start;gap:12px;margin:14px auto 0;width:252px}
  .pad{display:-webkit-grid;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    gap:8px;width:196px}
  .pad .b{height:54px;font-size:15px}
  .pad .ok{font-weight:600}

  .vcol{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;
    -webkit-align-items:center;align-items:center;gap:6px;padding-top:2px}
  .vtrack{position:relative;width:30px;height:170px;border-radius:15px;background:rgba(255,255,255,.08);
    overflow:hidden;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none}
  .vfill{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.85);
    -webkit-transition:height .08s linear;transition:height .08s linear}
  .vfill.mute{background:rgba(255,255,255,.18)}
  .vtick{position:absolute;left:6px;right:6px;height:1px;background:rgba(0,0,0,.2)}
  .vnum{position:absolute;top:2px;left:0;right:0;text-align:center;font-size:10px;font-weight:600;color:rgba(0,0,0,.7)}
  .vmute{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.06);display:-webkit-flex;
    display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
  .vmute.on{background:#fff;color:#0a0a0d}
  .vlab{font-size:10px;color:rgba(255,255,255,.45);height:12px;line-height:12px}

  /* 音量 / 倍速：都能长按连发 */
  .kb{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;
    -webkit-justify-content:center;justify-content:center;padding:12px 10px 0;font-size:12px}
  .kb button{height:44px;padding:0 10px;margin:3px;border-radius:12px;background:rgba(255,255,255,.06)}
  .kb button:active{background:rgba(255,255,255,.22)}
  .kb button.on{background:#fff;color:#0a0a0d;font-weight:600}

  .bottom{display:-webkit-flex;display:flex;gap:8px;padding:12px 16px 0;font-size:12px}
  .bottom .b{-webkit-flex:1;flex:1;height:44px}

  .hint{text-align:center;font-size:10.5px;line-height:1.7;color:rgba(255,255,255,.3);
    padding:16px 32px 26px;margin:auto 0 0}

  #toast{position:fixed;left:16px;right:16px;bottom:24px;z-index:60;border-radius:12px;
    background:rgba(255,255,255,.14);padding:10px 12px;text-align:center;font-size:12px;
    color:rgba(255,255,255,.92);opacity:0;pointer-events:none;-webkit-transition:opacity .18s;transition:opacity .18s}
  #toast.on{opacity:1}

  /* 搜索浮层：一直挂着（只是移出屏幕），点「搜索」时 focus 能直接顶起键盘 */
  #ssearch{position:fixed;top:0;right:0;bottom:0;left:0;z-index:52;background:rgba(0,0,0,.6);
    display:-webkit-flex;display:flex;-webkit-align-items:flex-end;align-items:flex-end;
    opacity:0;pointer-events:none;-webkit-transition:opacity .18s;transition:opacity .18s}
  #ssearch.on{opacity:1;pointer-events:auto}
  #ssearch .sh{-webkit-transform:translateY(100%);transform:translateY(100%);
    -webkit-transition:-webkit-transform .2s;transition:transform .2s}
  #ssearch.on .sh{-webkit-transform:translateY(0);transform:translateY(0)}
  .spt{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:8px}
  .spt input{-webkit-flex:1;flex:1;min-width:0;height:48px;border:0;border-radius:12px;
    background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:15px;padding:0 12px;-webkit-appearance:none}
  .spt input::-webkit-input-placeholder{color:rgba(255,255,255,.32)}
  .spt button{-webkit-flex:none;flex:none;height:48px;padding:0 20px;border-radius:12px;
    background:#fff;color:#0a0a0d;font-size:15px;font-weight:600}
  .spt button:active{-webkit-transform:scale(.95);transform:scale(.95)}
  .sq-note{margin:8px 0 0;font-size:10.5px;line-height:1.6;color:rgba(255,255,255,.32)}

  /* 选集 / 线路浮层 */
  #sheet{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;display:none;
    -webkit-align-items:flex-end;align-items:flex-end;background:rgba(0,0,0,.6)}
  #sheet.on{display:-webkit-flex;display:flex}
  .sh{width:100%;max-height:64vh;background:#141416;border-radius:18px 18px 0 0;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom));overflow:auto;-webkit-overflow-scrolling:touch}
  .sh h4{margin:0 0 12px;font-size:13px;font-weight:600;display:-webkit-flex;display:flex;
    -webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between}
  .sh h4 button{font-size:12px;color:rgba(255,255,255,.5);font-weight:400}
  .grid{display:-webkit-grid;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .grid .ep{height:42px;border-radius:10px;background:rgba(255,255,255,.06);font-size:12px;
    display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;
    -webkit-justify-content:center;justify-content:center;padding:0 4px;overflow:hidden}
  .grid .ep.cur{background:#fff;color:#0a0a0d;font-weight:600}
  .grid .ep:active{background:rgba(255,255,255,.24)}
  .lnlist .ln{width:100%;height:46px;border-radius:10px;background:rgba(255,255,255,.06);
    font-size:12.5px;margin-bottom:8px;padding:0 12px;text-align:left}
  .lnlist .ln.cur{background:#fff;color:#0a0a0d;font-weight:600}
  .empty{font-size:12px;color:rgba(255,255,255,.4);padding:8px 0 4px;text-align:center}
  svg{display:block}
</style>
</head>
<body>
  <div class="top">
    <span class="dot" id="dot"></span>
    <div class="who">
      <b id="who">正在连接…</b>
      <span id="sub">遥控已连接</span>
    </div>
    <button class="vib" id="vib">震动 开</button>
  </div>

  <div class="card">
    <div class="trow">
      <div class="tmain">
        <div class="title" id="title">—</div>
        <div class="subline" id="subline" style="display:none"></div>
      </div>
      <!-- 上集 / 下集：追剧时最常用的两个键 -->
      <button class="mini dim" id="btnPrev" aria-label="上一集">‹ 上集</button>
      <button class="mini dim" id="btnNext" aria-label="下一集">下集 ›</button>
    </div>
    <div class="bar">
      <span id="pos">0:00</span>
      <input type="range" id="seek" min="0" max="1" value="0" step="1" aria-label="进度">
      <span id="dur">0:00</span>
    </div>
    <!-- 音量 / 倍速 / 静音状态：以前按了完全没反馈 -->
    <div class="stat" id="stat">音量 100%<u>·</u>1×</div>
  </div>

  <div class="row">
    <button class="b b14" data-cmd="seekb" data-arg="10" aria-label="快退 10 秒">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M11 7l-5 5 5 5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18 7l-5 5 5 5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="play" id="playBtn" aria-label="播放">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" style="margin-left:3px"><path d="M8 5.5v13l11-6.5z"/></svg>
    </button>
    <button class="b b14" data-cmd="seekf" data-arg="10" aria-label="快进 10 秒">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M6 7l5 5-5 5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13 7l5 5-5 5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="chips">
    <button class="b" id="btnSearch">搜索</button>
    <button class="b dim" id="btnEps">选集</button>
    <button class="b dim" id="btnLines">线路</button>
  </div>

  <div class="padwrap">
    <div class="pad">
      <span></span><button class="b" data-cmd="up" data-hold="1" aria-label="上">▲</button><span></span>
      <button class="b" data-cmd="left" data-hold="1" aria-label="左">◀</button>
      <button class="b ok" data-cmd="ok" aria-label="确定">确定</button>
      <button class="b" data-cmd="right" data-hold="1" aria-label="右">▶</button>
      <span></span><button class="b" data-cmd="down" data-hold="1" aria-label="下">▼</button><span></span>
    </div>
    <div class="vcol">
      <div class="vtrack" id="volTrack" role="slider" tabindex="0"
        aria-label="音量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
        <div class="vfill" id="volFill" style="height:100%"></div>
        <span class="vtick" style="bottom:20%"></span>
        <span class="vtick" style="bottom:40%"></span>
        <span class="vtick" style="bottom:60%"></span>
        <span class="vtick" style="bottom:80%"></span>
        <span class="vnum" id="volNum" hidden></span>
      </div>
      <button class="vmute" id="muteBtn" aria-label="静音">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4z" stroke-linejoin="round"/>
          <path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11" stroke-linecap="round"/>
        </svg>
      </button>
      <span class="vlab" id="volLab">100%</span>
    </div>
  </div>

  <div class="kb">
    <button id="volDown" aria-label="音量减">音量 −</button>
    <button id="volUp" aria-label="音量加">音量 +</button>
    <button id="rateDown" aria-label="减速">倍速 −</button>
    <button id="rateUp" aria-label="加速">倍速 +</button>
  </div>

  <div class="bottom">
    <button class="b" id="fsBtn">全屏</button>
    <button class="b" data-cmd="back">返回</button>
    <button class="b" data-cmd="home">回首页</button>
  </div>

  <div id="ssearch">
    <div class="sh">
      <h4><span>在手机上打片名</span><button id="ssClose">关闭</button></h4>
      <div class="spt">
        <input id="ssInput" type="search" placeholder="电影 / 剧集 / 综艺名" autocomplete="off"
          autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <button id="ssGo">搜索</button>
      </div>
      <p class="sq-note" id="ssNote">对方页面会自己回到首页并搜这个词。</p>
    </div>
  </div>

  <div id="sheet">
    <div class="sh">
      <h4><span id="shTitle">选集</span><button id="shClose">关闭</button></h4>
      <div id="shBody"></div>
    </div>
  </div>

  <div id="toast"></div>

  <p class="hint">十字键、音量、倍速都能长按连发；确定键点进去，首页、详情页、搜索结果都能用，不只是播放器。
    这个页面只控制发起方的那一个页面，关掉对方页面后这里会显示「已关闭」。</p>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var T = (q.get('t') || '').toUpperCase();
  var ctlId = (function () {
    try {
      var v = localStorage.getItem('mfl:ctlid');
      if (v) return v;
      v = 'c' + Math.random().toString(36).slice(2, 9);
      localStorage.setItem('mfl:ctlid', v);
      return v;
    } catch (e) { return 'c0'; }
  })();

  /* 乐观值只在短窗口内有效：服务端追平后自然交还给它 */
  var OPTIM_TTL = 1800;
  var VOL_STEP = 10;
  var RATE_STEP = 0.25;

  var elWho = document.getElementById('who');
  var elSub = document.getElementById('sub');
  var elDot = document.getElementById('dot');
  var elTitle = document.getElementById('title');
  var elSubline = document.getElementById('subline');
  var elPos = document.getElementById('pos');
  var elDur = document.getElementById('dur');
  var elSeek = document.getElementById('seek');
  var elStat = document.getElementById('stat');
  var playBtn = document.getElementById('playBtn');
  var vibBtn = document.getElementById('vib');
  var prevBtn = document.getElementById('btnPrev');
  var nextBtn = document.getElementById('btnNext');
  var epsBtn = document.getElementById('btnEps');
  var linesBtn = document.getElementById('btnLines');
  var muteBtn = document.getElementById('muteBtn');
  var fsBtn = document.getElementById('fsBtn');
  var toast = document.getElementById('toast');
  var sheet = document.getElementById('sheet');
  var shTitle = document.getElementById('shTitle');
  var shBody = document.getElementById('shBody');

  var vibrate = true;
  var dragging = false;
  var dragVal = 0;
  var eps = { cur: -1, list: [] };
  var lines = { cur: -1, list: [] };
  var sheetOpen = '';
  var curState = null;
  var stateAt = 0;
  var lastWalk = 0;
  var optim = { playing: null, vol: null, rate: null, muted: null, at: 0 };
  var toastTimer = 0;

  function fmt(s) {
    s = Math.max(0, Math.floor(s || 0));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return h > 0 ? h + ':' + p(m) + ':' + p(ss) : m + ':' + p(ss);
  }

  function fmtRate(r) {
    return (r % 1 === 0 ? r : r.toFixed(2).replace(/0$/, '')) + '×';
  }

  function say(msg) {
    toast.textContent = msg;
    toast.className = 'on';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.className = ''; }, 1800);
  }

  function send(cmd, arg, buzz) {
    if (!T) return;
    if (vibrate && navigator.vibrate) { try { navigator.vibrate(buzz || 8); } catch (e) {} }
    fetch('/api/rs/cmd?t=' + encodeURIComponent(T) + '&cmd=' + encodeURIComponent(cmd) +
      '&arg=' + encodeURIComponent(arg || ''), { cache: 'no-store' }).catch(function () {});
  }

  /* 本地先算出新值再发绝对值（volset / rateset），两端不会漂 */
  function mark(patch) {
    for (var k in patch) optim[k] = patch[k];
    optim.at = Date.now();
    paintSoon();
  }
  function fresh() { return optim.at > 0 && Date.now() - optim.at < OPTIM_TTL; }
  function eff(key, fallback) {
    return (fresh() && optim[key] !== null && optim[key] !== undefined) ? optim[key] : fallback;
  }

  function volStep(dir) {
    var cur = curState && curState.vol != null ? curState.vol : 100;
    cur = eff('vol', cur);
    var next = Math.max(0, Math.min(100, Math.round(cur + dir * VOL_STEP)));
    mark({ vol: next, muted: false });
    send('volset', String(next), 6);
  }
  function rateStep(dir) {
    var cur = curState && curState.rate ? curState.rate / 100 : 1;
    cur = eff('rate', cur);
    var next = Math.min(3, Math.max(0.5, Math.round((cur + dir * RATE_STEP) * 4) / 4));
    mark({ rate: next });
    send('rateset', String(Math.round(next * 100)), 6);
  }

  /* ---------- 长按连发 ---------- */
  function bindRepeat(btn, fire) {
    var t1 = 0, t2 = 0, lastDown = 0;
    function stop() {
      if (t1) { clearTimeout(t1); t1 = 0; }
      if (t2) { clearInterval(t2); t2 = 0; }
    }
    function start(e) {
      if (e && e.preventDefault) e.preventDefault();
      lastDown = Date.now();
      stop();
      fire();
      t1 = setTimeout(function () { t2 = setInterval(fire, 140); }, 420);
    }
    btn.addEventListener('touchstart', start, { passive: false });
    btn.addEventListener('touchend', stop);
    btn.addEventListener('touchcancel', stop);
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', stop);
    btn.addEventListener('mouseleave', stop);
    // 键盘 / 读屏走 click：刚才 pointerdown 已经发过就跳过，别双发
    btn.addEventListener('click', function () {
      if (Date.now() - lastDown < 600) return;
      fire();
    });
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }

  /* "cur|名字|名字" → {cur, list} */
  function unpack(v) {
    if (!v) return { cur: -1, list: [] };
    var parts = String(v).split('|');
    return { cur: parseInt(parts[0], 10), list: parts.slice(1) };
  }

  document.querySelectorAll('[data-cmd]').forEach(function (b) {
    var cmd = b.getAttribute('data-cmd'), arg = b.getAttribute('data-arg') || '';
    if (b.hasAttribute('data-hold')) {
      bindRepeat(b, function () { send(cmd, arg, 5); });
    } else {
      b.addEventListener('click', function () { send(cmd, arg); });
    }
  });

  bindRepeat(document.getElementById('volDown'), function () { volStep(-1); });
  bindRepeat(document.getElementById('volUp'), function () { volStep(1); });
  bindRepeat(document.getElementById('rateDown'), function () { rateStep(-1); });
  bindRepeat(document.getElementById('rateUp'), function () { rateStep(1); });

  vibBtn.addEventListener('click', function () {
    vibrate = !vibrate;
    vibBtn.textContent = vibrate ? '震动 开' : '震动 关';
  });

  /* 暂停 / 播放：本地先翻，等服务端对齐 */
  playBtn.addEventListener('click', function () {
    var playing = eff('playing', curState ? !!curState.playing : false);
    mark({ playing: !playing });
    send('toggle');
  });
  muteBtn.addEventListener('click', function () {
    var muted = eff('muted', curState ? !!curState.muted : false);
    mark({ muted: !muted });
    send('mute');
  });

  /* ---------- 竖音量条：按住跟着手指走，松手补发最后一个值 ---------- */
  var volTrack = document.getElementById('volTrack');
  var volFill = document.getElementById('volFill');
  var volNum = document.getElementById('volNum');
  var volLab = document.getElementById('volLab');
  var volHold = false, volSentAt = 0, volLatest = 100;

  function pctAt(clientY) {
    var r = volTrack.getBoundingClientRect();
    var p = 1 - (clientY - r.top) / Math.max(1, r.height);
    return Math.round(Math.min(1, Math.max(0, p)) * 100);
  }
  function setVol(p, force) {
    var v = Math.max(0, Math.min(100, Math.round(p)));
    volLatest = v;
    mark({ vol: v, muted: false });
    volNum.hidden = false;
    volNum.textContent = v;
    var now = Date.now();
    if (!force && now - volSentAt < 90) return;
    volSentAt = now;
    send('volset', String(v), 3);
  }
  if (volTrack) {
    volTrack.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      volHold = true;
      try { volTrack.setPointerCapture(e.pointerId); } catch (err) {}
      setVol(pctAt(e.clientY), true);
    });
    volTrack.addEventListener('pointermove', function (e) {
      if (!volHold) return;
      setVol(pctAt(e.clientY));
    });
    function endVol(e) {
      if (!volHold) return;
      volHold = false;
      try { volTrack.releasePointerCapture(e.pointerId); } catch (err) {}
      // 节流可能吞掉最后一格，松手必补一次
      send('volset', String(volLatest), 3);
      setTimeout(function () { volNum.hidden = true; }, 260);
    }
    volTrack.addEventListener('pointerup', endVol);
    volTrack.addEventListener('pointercancel', endVol);
    volTrack.addEventListener('keydown', function (e) {
      var v = Math.round(eff('vol', curState && curState.vol != null ? curState.vol : 100));
      if (e.key === 'ArrowUp') { setVol(v + VOL_STEP, true); e.preventDefault(); }
      else if (e.key === 'ArrowDown') { setVol(v - VOL_STEP, true); e.preventDefault(); }
    });
  }

  /* 全屏：被控端在浏览器里，原生全屏必须由「真实用户手势」触发，手机上的按键传过去不算，
     所以被控端走网页全屏（纯 CSS 铺满）。这里不猜结果：发完 1.8 秒拿真实状态比对一次，
     没变化就把原因说出来，而不是留一个按了没反应的按钮。 */
  fsBtn.addEventListener('click', function () {
    var before = curState ? !!curState.fs : false;
    send('fullscreen', '', 10);
    setTimeout(function () {
      var now = curState ? !!curState.fs : false;
      if (now === before) say(before ? '还没退出全屏，对方可能不在这页' : '这个页面没有可全屏的画面');
    }, 1800);
  });

  prevBtn.addEventListener('click', function () {
    if (eps.list.length && eps.cur > 0) send('prev');
    else say(eps.list.length ? '这已经是第一集' : '对方页面没有分集');
  });
  nextBtn.addEventListener('click', function () {
    if (eps.list.length && eps.cur >= 0 && eps.cur < eps.list.length - 1) send('next');
    else say(eps.list.length ? '这已经是最后一集' : '对方页面没有分集');
  });

  elSeek.addEventListener('input', function () {
    dragging = true;
    dragVal = Number(elSeek.value) || 0;
    elPos.textContent = fmt(dragVal);
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    // 从拖动目标继续走：服务端还没执行到新位置的那一秒里进度条别往回跳
    lastWalk = dragVal;
    if (curState) curState.pos = Math.round(dragVal);
    stateAt = Date.now();
    send('seekto', String(Math.round(dragVal)));
    setTimeout(function () { elPos.textContent = fmt(dragVal); }, 300);
  }
  elSeek.addEventListener('change', endDrag);
  elSeek.addEventListener('pointerup', endDrag);
  elSeek.addEventListener('touchend', endDrag);

  /* ---------- 选集 / 线路 ---------- */
  function closeSheet() {
    sheetOpen = '';
    sheet.className = '';
  }
  document.getElementById('shClose').addEventListener('click', closeSheet);
  sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); });

  function fillSheet(kind) {
    sheetOpen = kind;
    if (kind === 'eps') {
      shTitle.textContent = '选集 · 共 ' + eps.list.length + ' 集';
      if (!eps.list.length) { shBody.innerHTML = '<div class="empty">这个页面现在没有分集（首页 / 搜索页正常）</div>'; }
      else {
        var h = '<div class="grid">';
        for (var i = 0; i < eps.list.length; i++) {
          h += '<button class="ep' + (i === eps.cur ? ' cur' : '') + '" data-ep="' + i + '">' +
            esc(eps.list[i] || ('第' + (i + 1) + '集')) + '</button>';
        }
        shBody.innerHTML = h + '</div>';
      }
    } else {
      shTitle.textContent = '线路 · 共 ' + lines.list.length + ' 条';
      if (!lines.list.length) { shBody.innerHTML = '<div class="empty">这个页面现在没有可选线路</div>'; }
      else {
        var h2 = '<div class="lnlist">';
        for (var j = 0; j < lines.list.length; j++) {
          h2 += '<button class="ln' + (j === lines.cur ? ' cur' : '') + '" data-ln="' + j + '">' +
            esc(lines.list[j] || ('线路 ' + (j + 1))) + '</button>';
        }
        shBody.innerHTML = h2 + '</div>';
      }
    }
    sheet.className = 'on';
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  shBody.addEventListener('click', function (e) {
    var ep = e.target.closest ? e.target.closest('[data-ep]') : null;
    if (ep) {
      send('ep', ep.getAttribute('data-ep'));
      ep.className = 'ep cur';
      setTimeout(closeSheet, 180);
      return;
    }
    var ln = e.target.closest ? e.target.closest('[data-ln]') : null;
    if (ln) {
      var idx = parseInt(ln.getAttribute('data-ln'), 10) || 0;
      send('line', String(idx));
      ln.className = 'ln cur';
      setTimeout(closeSheet, 180);
    }
  });

  epsBtn.addEventListener('click', function () {
    if (!eps.list.length) { say('对方页面现在没有分集'); return; }
    fillSheet('eps');
  });
  linesBtn.addEventListener('click', function () {
    if (!lines.list.length) { say('对方页面现在没有可选线路'); return; }
    fillSheet('lines');
  });

  /* ---------- 搜索：手机上打字，对方页面直接搜 ---------- */
  var ss = document.getElementById('ssearch');
  var ssInput = document.getElementById('ssInput');
  var ssNote = document.getElementById('ssNote');

  function openSearch() {
    ss.className = 'on';
    // 输入框一直在 DOM 里（只是移出屏幕），这里 focus 能直接顶起手机键盘
    try { ssInput.focus(); } catch (e) {}
  }
  function closeSearch() {
    ss.className = '';
    try { ssInput.blur(); } catch (e) {}
  }
  function submitSearch() {
    var q2 = (ssInput.value || '').trim();
    if (!q2) { try { ssInput.focus(); } catch (e) {} return; }
    send('search', q2);
    ssNote.textContent = '已让「' + (elWho.textContent || '对方页面') + '」搜索「' + q2 + '」';
    ssInput.value = '';
    closeSearch();
    setTimeout(function () { ssNote.textContent = '对方页面会自己回到首页并搜这个词。'; }, 2400);
  }
  document.getElementById('btnSearch').addEventListener('click', openSearch);
  document.getElementById('ssClose').addEventListener('click', closeSearch);
  document.getElementById('ssGo').addEventListener('click', submitSearch);
  ssInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.keyCode === 13) { e.preventDefault(); submitSearch(); }
  });
  ss.addEventListener('click', function (e) { if (e.target === ss) closeSearch(); });

  /* ---------- 状态渲染 ---------- */
  function paintStat() {
    var st = curState || {};
    var vol = eff('vol', st.vol == null ? 100 : st.vol);
    var rate = eff('rate', st.rate ? st.rate / 100 : 1);
    var muted = eff('muted', !!st.muted);
    if (!st.dur && !st.playing) {
      elStat.textContent = '对方页面没在放片';
      return;
    }
    var html = muted
      ? '<b>已静音</b>'
      : '音量 ' + Math.round(vol) + '%';
    html += '<u>·</u>' + fmtRate(rate);
    if (st.playing) html += '<u>·</u><i>播放中</i>';
    elStat.innerHTML = html;
  }

  function paintPlay() {
    var playing = eff('playing', curState ? !!curState.playing : false);
    playBtn.innerHTML = playing
      ? '<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>'
      : '<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" style="margin-left:3px"><path d="M8 5.5v13l11-6.5z"/></svg>';
    playBtn.setAttribute('aria-label', playing ? '暂停' : '播放');
  }

  function paintSoon() {
    // 乐观值一变立刻重画，不等下一轮 900ms
    paintPlay();
    paintStat();
    paintMute();
    paintVol();
    paintFs();
    paintEpsButtons();
  }

  function paintVol() {
    var muted = eff('muted', curState ? !!curState.muted : false);
    var v = Math.round(eff('vol', curState && curState.vol != null ? curState.vol : 100));
    if (volFill) {
      volFill.style.height = (muted ? 0 : v) + '%';
      volFill.className = 'vfill' + (muted ? ' mute' : '');
    }
    if (volLab) volLab.textContent = muted ? '静音' : v + '%';
    if (volTrack) volTrack.setAttribute('aria-valuenow', String(v));
    if (volNum && !volHold) volNum.hidden = true;
  }

  function paintMute() {
    var muted = eff('muted', curState ? !!curState.muted : false);
    muteBtn.className = 'vmute' + (muted ? ' on' : '');
    muteBtn.setAttribute('aria-label', muted ? '取消静音' : '静音');
  }

  function paintFs() {
    var on = curState ? !!curState.fs : false;
    fsBtn.textContent = on ? '退出全屏' : '全屏';
    fsBtn.className = 'b' + (on ? ' on' : '');
  }

  function paintEpsButtons() {
    epsBtn.textContent = eps.list.length > 1 && eps.cur >= 0
      ? ('选集 ' + (eps.cur + 1) + '/' + eps.list.length) : '选集';
    linesBtn.textContent = lines.list.length > 1 && lines.cur >= 0
      ? ('线路 ' + (lines.cur + 1) + '/' + lines.list.length) : '线路';
    epsBtn.className = 'b' + (eps.list.length ? '' : ' dim');
    linesBtn.className = 'b' + (lines.list.length ? '' : ' dim');
    var canPrev = eps.list.length > 0 && eps.cur > 0;
    var canNext = eps.list.length > 0 && eps.cur >= 0 && eps.cur < eps.list.length - 1;
    prevBtn.className = 'mini' + (canPrev ? '' : ' dim');
    nextBtn.className = 'mini' + (canNext ? '' : ' dim');
  }

  function render(d) {
    var st = d.state || {};
    curState = st;
    stateAt = Date.now();

    elWho.textContent = d.name ? '正在遥控 ' + d.name : '正在连接…';
    var alive = d.hostAlive !== false;
    elDot.className = 'dot' + (alive ? '' : ' off');
    elSub.textContent = alive ? '遥控已连接' : '对方页面可能已关闭';
    elSub.className = alive ? '' : 'bad';
    elTitle.textContent = st.title || '—';

    if (st.sub) { elSubline.style.display = ''; elSubline.textContent = st.sub; }
    else { elSubline.style.display = 'none'; elSubline.textContent = ''; }

    var dur = st.dur || 0;
    elDur.textContent = fmt(dur);
    if (!dragging) {
      elSeek.max = String(Math.max(1, Math.floor(dur)));
      // 播放中交给下面的插值器（它会保证只往前走）；暂停 / 跳转后立刻对齐
      if (!st.playing) {
        lastWalk = st.pos || 0;
        elPos.textContent = fmt(st.pos || 0);
        elSeek.value = String(Math.min(st.pos || 0, Math.max(1, Math.floor(dur))));
      }
    }

    if (st.eps !== undefined) eps = unpack(st.eps);
    if (st.lines !== undefined) lines = unpack(st.lines);

    paintPlay();
    paintStat();
    paintMute();
    paintFs();
    paintEpsButtons();
  }

  /* 播放中就地插值：进度条不再每 0.9 秒跳一下；
     服务端状态是上一轮的快照，直接当基准会让进度往回跳，所以只允许往前走 */
  setInterval(function () {
    if (dragging || !curState) return;
    if (!curState.playing) { lastWalk = curState.pos || 0; return; }
    var dur = curState.dur || 0;
    if (dur <= 0) return;
    var p = (curState.pos || 0) + (Date.now() - stateAt) / 1000;
    if (p < lastWalk && lastWalk - p < 4) p = lastWalk;
    if (p > dur) p = dur;
    lastWalk = p;
    elPos.textContent = fmt(p);
    elSeek.value = String(Math.floor(p));
  }, 250);

  function tick() {
    if (!T) {
      elWho.textContent = '链接里没有遥控码';
      elSub.textContent = '请让对方重新生成二维码';
      return;
    }
    fetch('/api/rs/ctl?t=' + encodeURIComponent(T) + '&who=' + encodeURIComponent(ctlId),
      { cache: 'no-store' })
      .then(function (r) {
        if (r.status === 404) {
          elWho.textContent = '会话已关闭';
          elSub.textContent = '让对方重新点一次遥控按钮';
          elSub.className = 'bad';
          elDot.className = 'dot off';
          return null;
        }
        return r.ok ? r.json() : null;
      })
      .then(function (d) { if (d) render(d); })
      .catch(function () {})
      .then(function () { setTimeout(tick, 900); });
  }
  tick();
})();
</script>
</body>
</html>
