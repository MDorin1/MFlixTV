<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MFlixTV</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#0a0a0a;color:#fff;font-family:-apple-system,"Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;background:linear-gradient(#000,rgba(0,0,0,.6));padding:12px}
  .bar{display:flex;gap:8px}
  input{flex:1;min-width:0;background:#232323;border:1px solid #333;border-radius:8px;color:#fff;padding:10px 12px;font-size:15px}
  button{background:#e50914;border:0;color:#fff;border-radius:8px;padding:10px 16px;font-weight:700;font-size:15px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;padding:12px}
  .card{position:relative}
  .card img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:#1a1a1a}
  .t{font-size:13px;font-weight:700;margin-top:6px;line-height:1.25;text-shadow:0 1px 3px #000}
  .m{font-size:11px;color:#b3b3b3}
  .hint{padding:12px;color:#8a8a8a;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <input id="q" placeholder="输入影片 / 演员名称…" autocomplete="off">
    <button id="go">搜索</button>
  </div>
</header>
<div id="hint" class="hint">输入片名搜索（数据来自手机内置的点播源）</div>
<div id="grid" class="grid"></div>
<script>
const grid = document.getElementById('grid');
const hint = document.getElementById('hint');
async function run() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  hint.textContent = '搜索中…'; grid.innerHTML = '';
  try {
    const r = await fetch('/api/search?wd=' + encodeURIComponent(q));
    const d = await r.json();
    const list = d.list || [];
    hint.textContent = list.length ? ('共 ' + list.length + ' 条') : '没有结果';
    grid.innerHTML = list.map(function (it) {
      const pic = it.pic ? ('/api/proxy?url=' + encodeURIComponent(it.pic)) : '';
      return '<div class="card"><img loading="lazy" src="' + pic + '" alt=""><div class="t">' + (it.name || '') + '</div><div class="m">' + [it.year, it.sourceName].filter(Boolean).join(' · ') + '</div></div>';
    }).join('');
  } catch (e) { hint.textContent = '请求失败：' + e.message; }
}
document.getElementById('go').onclick = run;
document.getElementById('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });
</script>
</body>
</html>
