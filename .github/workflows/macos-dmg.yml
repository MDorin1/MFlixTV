name: 出 macOS 包（DMG + ZIP）

# 为什么要在 macOS runner 上做：
#   · Windows 上没有 hdiutil，做不出能被 Finder 挂载的 HFS+ 镜像，所以出不了 DMG；
#   · macOS 上未签名的 arm64 可执行文件会被系统直接杀掉（连报错都没有），
#     而 codesign 只有 Mac 上才有，所以签名也只能在这做。
#   · 顺带在真 Mac 上把启动脚本跑一遍，确认 8080 真能起来，而不是只验文件结构。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '把成品挂到哪个 Release'
        required: false
        default: 'v1.4'
      source_asset:
        description: '从哪个已有资产取载荷（zip 内部是 MFlixTV-macOS/ 目录）'
        required: false
        default: 'MFlixTV-macOS.zip'
      upload:
        description: '上传到 Release（填 yes 才传）'
        required: false
        default: 'yes'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  build:
    name: 组装 .app + 签名 + 冒烟测试 + 出 DMG
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 取载荷（现有 Release 资产）
        env:
          TAG: ${{ inputs.tag }}
          ASSET: ${{ inputs.source_asset }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
          echo "下载 $URL"
          curl -fL --retry 3 -o "$RUNNER_TEMP/dl/payload.zip" "$URL"
          ls -l "$RUNNER_TEMP/dl/payload.zip"
          unzip -q "$RUNNER_TEMP/dl/payload.zip" -d "$RUNNER_TEMP/work"
          test -f "$RUNNER_TEMP/work/MFlixTV-macOS/app/.next/BUILD_ID"
          test -f "$RUNNER_TEMP/work/MFlixTV-macOS/hongguo/server/src/main.js"
          echo "uname -m: $(uname -m)"

      - name: 去掉隔离属性、补执行位、核对架构
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/work/MFlixTV-macOS"
          xattr -cr "$P" || true
          chmod +x "$P/启动MFlixTV.command"
          chmod +x "$P/runtime/node-arm64" "$P/runtime/node-x64"
          chmod +x "$P/runtime/ffmpeg/ffmpeg-arm64" "$P/runtime/ffmpeg/ffmpeg-x64"
          echo "== 架构核对 =="
          for f in runtime/node-arm64 runtime/node-x64 runtime/ffmpeg/ffmpeg-arm64 runtime/ffmpeg/ffmpeg-x64; do
            printf '%-38s %s\n' "$f" "$(lipo -archs "$P/$f")"
          done

      - name: ad-hoc 签名（arm64 未签名会被系统直接杀掉）
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/work/MFlixTV-macOS"
          for f in "$P/runtime/node-arm64" "$P/runtime/node-x64" \
                   "$P/runtime/ffmpeg/ffmpeg-arm64" "$P/runtime/ffmpeg/ffmpeg-x64"; do
            codesign --force --sign - --timestamp=none "$f"
            printf '%-40s %s\n' "$(basename "$f")" "$(codesign -dv "$f" 2>&1 | grep -m1 'Signature')"
          done

      - name: 冒烟测试（跑真·启动脚本，验 8080）
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/work/MFlixTV-macOS"
          "$P/runtime/node-x64" -v
          "$P/runtime/ffmpeg/ffmpeg-x64" -hide_banner -version | head -2
          bash -n "$P/启动MFlixTV.command"
          cd "$P"
          ( bash 启动MFlixTV.command > "$RUNNER_TEMP/launch.log" 2>&1 & ) || true
          ok=""
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8080/ || true)
            if [ "$code" = "200" ]; then ok="200"; break; fi
            sleep 2
          done
          echo "--- launch.log ---"; cat "$RUNNER_TEMP/launch.log" || true
          echo "--- app/server.log ---"; tail -n 40 "$P/app/server.log" || true
          echo "--- hongguo/hg.log ---"; tail -n 20 "$P/hongguo/hg.log" || true
          echo "--- 静态资源 ---"; curl -s -o /dev/null -w "icon-192=%{http_code}\n" --max-time 5 http://127.0.0.1:8080/icons/icon-192.png || true
          echo "--- 首页标题 ---"; curl -s --max-time 5 http://127.0.0.1:8080/ | grep -o '<title>[^<]*</title>' | head -1 || true
          pkill -f 'next/dist/bin/next' || true
          pkill -f 'hongguo/server/src/main.js' || true
          test "$ok" = "200"

      - name: 组装 MFlixTV.app
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/work/MFlixTV-macOS"
          APP="$RUNNER_TEMP/MFlixTV.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          cp packaging/macos/MFlixTV "$APP/Contents/MacOS/MFlixTV"
          chmod +x "$APP/Contents/MacOS/MFlixTV"
          ICON_SRC=app/public/icons/icon-512.png
          if [ -f "$ICON_SRC" ]; then
            rm -rf "$RUNNER_TEMP/icon.iconset"; mkdir -p "$RUNNER_TEMP/icon.iconset"
            for s in 16 32 64 128 256 512; do
              sips -z $s $s "$ICON_SRC" --out "$RUNNER_TEMP/icon.iconset/icon_${s}x${s}.png" >/dev/null
            done
            sips -z 1024 1024 "$ICON_SRC" --out "$RUNNER_TEMP/icon.iconset/icon_512x512@2x.png" >/dev/null
            iconutil -c icns "$RUNNER_TEMP/icon.iconset" -o "$APP/Contents/Resources/app.icns"
            echo "图标已生成"
          else
            echo "没有图标源，跳过 icns"
          fi

          # node_modules 里有一堆符号链接（.bin/* 之类），
          # codesign 打包时会把「指向 bundle 外面的软链」判成 invalid destination，
          # 所以先把软链就地实体化，再进 bundle。
          n=0
          while IFS= read -r l; do
            t="$(readlink "$l")"
            case "$t" in /*) ;; *) t="$(cd "$(dirname "$l")" && cd "$t" 2>/dev/null && pwd)" ;; esac
            if [ -e "$t" ]; then
              rm -f "$l"
              cp -R "$t" "$l"
              n=$((n+1))
            else
              rm -f "$l"
            fi
          done < <(find "$P" -type l)
          echo "实体化软链 $n 个"

          ditto "$P" "$APP/Contents/Resources/payload"
          du -sh "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"

      - name: 签名 .app 并校验
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/MFlixTV.app"
          # 只签 bundle 本身（里面的 node/ffmpeg 已在前面单独签过）；
          # --deep 会顺着 Resources 里那些软链找目标，反而报错，所以不用。
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Identifier|Signature'
          bash -n "$APP/Contents/Resources/payload/启动MFlixTV.command"
          bash -n "$APP/Contents/MacOS/MFlixTV"
          test -x "$APP/Contents/Resources/payload/runtime/node-arm64"
          test -f "$APP/Contents/Resources/app.icns"

      - name: 打 DMG
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/MFlixTV.app"
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/MFlixTV.app"
          ln -s /Applications "$STAGE/应用程序"
          cp packaging/使用说明-macOS.txt "$STAGE/使用说明.txt"
          cp LICENSE "$STAGE/LICENSE" 2>/dev/null || true
          cp docs/合规与免责.md "$STAGE/合规与免责.md" 2>/dev/null || true
          hdiutil create -volname "MFlixTV" -fs HFS+ -srcfolder "$STAGE" \
            -ov -format UDZO -imagekey zlib-level=9 \
            "$RUNNER_TEMP/MFlixTV-macOS.dmg"
          hdiutil verify "$RUNNER_TEMP/MFlixTV-macOS.dmg"
          ls -l "$RUNNER_TEMP/MFlixTV-macOS.dmg"
          echo "== 挂载回读，确认内容真的在里面 =="
          MNT="$RUNNER_TEMP/mnt"
          hdiutil attach "$RUNNER_TEMP/MFlixTV-macOS.dmg" -mountpoint "$MNT" -nobrowse -readonly
          ls -la "$MNT"
          test -x "$MNT/MFlixTV.app/Contents/MacOS/MFlixTV"
          test -x "$MNT/MFlixTV.app/Contents/Resources/payload/runtime/node-arm64"
          test -f "$MNT/MFlixTV.app/Contents/Resources/payload/app/.next/BUILD_ID"
          codesign --verify --strict "$MNT/MFlixTV.app"
          echo "挂载后的总大小：$(du -sh "$MNT/MFlixTV.app" | cut -f1)"
          hdiutil detach "$MNT"

      - name: 额外出服务端形态 DMG（目录 + 启动.command，给“当服务器用”的人）
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/work/MFlixTV-macOS"
          STAGE="$RUNNER_TEMP/dmgserver"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          xattr -cr "$P" || true
          chmod 755 "$P/启动MFlixTV.command"
          chmod 755 "$P/runtime/node-arm64" "$P/runtime/node-x64" \
                    "$P/runtime/ffmpeg/ffmpeg-arm64" "$P/runtime/ffmpeg/ffmpeg-x64"
          ditto "$P" "$STAGE/MFlixTV-macOS"
          chmod 755 "$STAGE/MFlixTV-macOS/启动MFlixTV.command"
          hdiutil create -volname "MFlixTV" -fs HFS+ -srcfolder "$STAGE" \
            -ov -format UDZO -imagekey zlib-level=9 \
            "$RUNNER_TEMP/MFlixTV-macOS-Server.dmg"
          hdiutil verify "$RUNNER_TEMP/MFlixTV-macOS-Server.dmg"
          echo "== 挂回读：权限位与文件数 =="
          MNT="$RUNNER_TEMP/mnt2"
          hdiutil attach "$RUNNER_TEMP/MFlixTV-macOS-Server.dmg" -mountpoint "$MNT" -nobrowse -readonly
          ls -l "$MNT"
          stat -f '%Sp %N' "$MNT/MFlixTV-macOS/启动MFlixTV.command"
          test -x "$MNT/MFlixTV-macOS/启动MFlixTV.command"
          test -x "$MNT/MFlixTV-macOS/runtime/node-arm64"
          test -x "$MNT/MFlixTV-macOS/runtime/node-x64"
          test -x "$MNT/MFlixTV-macOS/runtime/ffmpeg/ffmpeg-arm64"
          test -x "$MNT/MFlixTV-macOS/runtime/ffmpeg/ffmpeg-x64"
          n_img=$(find "$MNT" -type f ! -name '._*' | wc -l | tr -d ' ')
          n_zip=$(unzip -l "$RUNNER_TEMP/dl/payload.zip" | tail -1 | awk '{print $2}')
          echo "DMG 内文件数（不含 ._ 资源叉）：$n_img"
          echo "zip 载荷条目数：$n_zip"
          hdiutil detach "$MNT"
          ls -l "$RUNNER_TEMP/MFlixTV-macOS-Server.dmg"

      - name: 同时刷一份 ZIP（给不想装 App 的人）
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/work"
          rm -f "$RUNNER_TEMP/MFlixTV-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent MFlixTV-macOS "$RUNNER_TEMP/MFlixTV-macOS.zip"
          ls -l "$RUNNER_TEMP/MFlixTV-macOS.zip"
          unzip -l "$RUNNER_TEMP/MFlixTV-macOS.zip" | tail -3
          unzip -l "$RUNNER_TEMP/MFlixTV-macOS.zip" | grep -c 'MFlixTV-macOS/' || true

      - name: 汇总校验值
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          { for f in MFlixTV-macOS.dmg MFlixTV-macOS-Server.dmg MFlixTV-macOS.zip; do
              printf '%-28s %12d  MD5 %s\n' "$f" "$(stat -f%z "$f")" "$(md5 -q "$f")"
            done; } | tee SUMS.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: MFlixTV-macOS
          path: |
            ${{ runner.temp }}/MFlixTV-macOS.dmg
            ${{ runner.temp }}/MFlixTV-macOS-Server.dmg
            ${{ runner.temp }}/MFlixTV-macOS.zip
            ${{ runner.temp }}/SUMS.txt
          retention-days: 7

      - name: 上传到 Release
        if: ${{ inputs.upload == 'yes' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RUNNER_TEMP/MFlixTV-macOS.dmg" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" "$RUNNER_TEMP/MFlixTV-macOS-Server.dmg" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" "$RUNNER_TEMP/MFlixTV-macOS.zip" --clobber --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
             -q '.assets[] | "\(.name)  \(.size)"'
