name: 出 MFlixMusic macOS 包（DMG）

# 为什么必须在 macOS runner 上做：
#   · hdiutil 只有 macOS 自带，Windows 上没有能把文件夹做成可挂载 HFS+ 镜像的工具；
#   · macOS 上未签名的 arm64 可执行文件会被系统直接杀掉，codesign 也只有 Mac 上有。
#
# 载荷从 Release 资产取（MFlixMusic 不走 git 仓库，只有影视这个仓库有 Actions）：
#   资产名 MFlixMusic-macOS-payload.zip，里面是 MFlixMusic/ 目录：
#   server.js / package.json / src/ / public/ / node_modules/（已剔除构建期依赖）
#   Node 运行时在这里现下（darwin-arm64 + darwin-x64），不塞进载荷。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（写进 Info.plist 与 dmg 名）'
        required: false
        default: '3.16'
      node_version:
        description: 'Node 版本（darwin 二进制）'
        required: false
        default: '22.20.0'
      payload_tag:
        description: '载荷所在 Release 标签'
        required: false
        default: 'music-payload'
      payload_asset:
        description: '载荷资产名'
        required: false
        default: 'MFlixMusic-macOS-payload.zip'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  build:
    name: 组装 .app + 签名 + 冒烟测试 + 出 DMG
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: 取载荷
        env:
          TAG: ${{ inputs.payload_tag }}
          ASSET: ${{ inputs.payload_asset }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
          echo "下载 $URL"
          curl -fL --retry 3 -o "$RUNNER_TEMP/dl/payload.zip" "$URL"
          unzip -q "$RUNNER_TEMP/dl/payload.zip" -d "$RUNNER_TEMP/work"
          test -f "$RUNNER_TEMP/work/MFlixMusic/server.js"
          test -f "$RUNNER_TEMP/work/MFlixMusic/public/index.html"
          test -d "$RUNNER_TEMP/work/MFlixMusic/node_modules/pinyin-pro"
          test -d "$RUNNER_TEMP/work/MFlixMusic/node_modules/qrcode"
          echo "uname -m: $(uname -m)"

      - name: 取 Node 运行时（darwin-arm64 / darwin-x64）
        env:
          NV: ${{ inputs.node_version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nodedl"
          for arch in arm64 x64; do
            f="node-v${NV}-darwin-${arch}.tar.gz"
            curl -fL --retry 3 -o "$RUNNER_TEMP/nodedl/$f" "https://nodejs.org/dist/v${NV}/${f}"
            tar -xzf "$RUNNER_TEMP/nodedl/$f" -C "$RUNNER_TEMP/nodedl"
            cp "$RUNNER_TEMP/nodedl/node-v${NV}-darwin-${arch}/bin/node" "$RUNNER_TEMP/nodedl/node-${arch}"
            chmod +x "$RUNNER_TEMP/nodedl/node-${arch}"
            printf '%-12s %s\n' "node-${arch}" "$(lipo -archs "$RUNNER_TEMP/nodedl/node-${arch}")"
            "$RUNNER_TEMP/nodedl/node-${arch}" -v
          done

      - name: 组装 MFlixMusic.app
        env:
          VER: ${{ inputs.version }}
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/work/MFlixMusic"
          APP="$RUNNER_TEMP/MFlixMusic.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/runtime"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>MFlix Music</string>
            <key>CFBundleDisplayName</key><string>MFlix Music</string>
            <key>CFBundleExecutable</key><string>MFlixMusic</string>
            <key>CFBundleIdentifier</key><string>com.mflix.music</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>app.icns</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.music</string>
          </dict>
          </plist>
          PLIST

          # 启动器：自己起服务，不弹终端；起好后开无地址栏窗口并常驻前台
          # （进程一退 Dock 图标就消失，所以最后要 wait）
          cat > "$APP/Contents/MacOS/MFlixMusic" <<'LAUNCH'
          #!/bin/bash
          set -u
          RES="$(cd "$(dirname "$0")/../Resources" && pwd)"
          PAY="$RES/payload"
          LOGDIR="$HOME/Library/Logs/MFlixMusic"
          mkdir -p "$LOGDIR"
          LOG="$LOGDIR/mflix-music.log"

          notify() { /usr/bin/osascript -e "display notification \"$2\" with title \"$1\"" >/dev/null 2>&1 || true; }
          alert() { /usr/bin/osascript -e "display alert \"MFlix Music\" message \"$1\"" >/dev/null 2>&1 || true; }

          {
            echo "=== $(date '+%Y-%m-%d %H:%M:%S') app launch ==="
            echo "app=$RES payload=$PAY"
          } >> "$LOG"

          /usr/bin/xattr -dr com.apple.quarantine "$RES" 2>/dev/null || true

          if [ "$(uname -m)" = "arm64" ]; then NODE="$RES/runtime/node-arm64"; else NODE="$RES/runtime/node-x64"; fi
          if [ ! -x "$NODE" ]; then
            /bin/chmod +x "$RES/runtime/node-arm64" "$RES/runtime/node-x64" 2>/dev/null
          fi
          if [ ! -x "$NODE" ]; then
            alert "安装不完整：找不到内置的 Node 运行时，请重新下载安装包。"
            exit 3
          fi

          PORT=8090
          while [ "$PORT" -lt 8130 ] && /usr/bin/nc -z 127.0.0.1 "$PORT" >/dev/null 2>&1; do PORT=$((PORT+1)); done
          if [ "$PORT" -ge 8130 ]; then
            alert "8090 附近的端口都被占用了，先关掉占口的程序再启动。"
            exit 4
          fi
          URL="http://127.0.0.1:${PORT}/"

          open_window() {
            UD="$HOME/Library/Application Support/MFlixMusic/browser"
            /bin/mkdir -p "$UD"
            if [ -d "/Applications/Google Chrome.app" ]; then
              /usr/bin/open -na "Google Chrome" --args --app="$URL" --user-data-dir="$UD" --window-size=1440,900
            elif [ -d "/Applications/Microsoft Edge.app" ]; then
              /usr/bin/open -na "Microsoft Edge" --args --app="$URL" --user-data-dir="$UD" --window-size=1440,900
            else
              /usr/bin/open "$URL"
            fi
          }

          cd "$PAY" || exit 5
          PORT="$PORT" "$NODE" server.js >> "$LOG" 2>&1 &
          PID=$!

          cleanup() {
            echo "$(date '+%H:%M:%S') stopping" >> "$LOG"
            kill "$PID" 2>/dev/null
            exit 0
          }
          trap cleanup INT TERM HUP

          ok=""
          i=0
          while [ "$i" -lt 60 ]; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 "$URL" 2>/dev/null || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
            i=$((i+1))
          done
          if [ -z "$ok" ]; then
            alert "服务没能起来，日志在 ~/Library/Logs/MFlixMusic/mflix-music.log。"
            exit 6
          fi

          IP="$(/usr/sbin/ipconfig getifaddr en0 2>/dev/null || /usr/sbin/ipconfig getifaddr en1 2>/dev/null)"
          if [ "${MFLIX_NOBROWSER:-}" = "1" ]; then
            echo "READY $URL LAN http://${IP:-unknown}:$PORT"
          else
            open_window
            if [ -n "$IP" ]; then
              printf 'http://%s:%s/' "$IP" "$PORT" | /usr/bin/pbcopy 2>/dev/null || true
              echo "READY $URL LAN http://$IP:$PORT" >> "$LOG"
              notify "MFlix Music 已启动" "手机/电视用 http://$IP:$PORT （已复制到剪贴板）"
            else
              notify "MFlix Music 已启动" "本机 $URL（没读到局域网 IP，检查 Wi-Fi）"
            fi
          fi

          wait "$PID"
          cleanup
          LAUNCH
          chmod +x "$APP/Contents/MacOS/MFlixMusic"

          cp "$RUNNER_TEMP/nodedl/node-arm64" "$APP/Contents/Resources/runtime/node-arm64"
          cp "$RUNNER_TEMP/nodedl/node-x64" "$APP/Contents/Resources/runtime/node-x64"
          chmod +x "$APP/Contents/Resources/runtime/node-arm64" "$APP/Contents/Resources/runtime/node-x64"

          xattr -cr "$P" || true
          ditto "$P" "$APP/Contents/Resources/payload"

          ICON_SRC="$P/public/icon-512.png"
          if [ -f "$ICON_SRC" ]; then
            rm -rf "$RUNNER_TEMP/icon.iconset"; mkdir -p "$RUNNER_TEMP/icon.iconset"
            for s in 16 32 64 128 256 512; do
              sips -z $s $s "$ICON_SRC" --out "$RUNNER_TEMP/icon.iconset/icon_${s}x${s}.png" >/dev/null
            done
            sips -z 1024 1024 "$ICON_SRC" --out "$RUNNER_TEMP/icon.iconset/icon_512x512@2x.png" >/dev/null
            iconutil -c icns "$RUNNER_TEMP/icon.iconset" -o "$APP/Contents/Resources/app.icns"
            echo "图标已生成"
          else
            echo "载荷里没有 icon-512.png，跳过 icns"
          fi
          du -sh "$APP"

      - name: ad-hoc 签名 + 校验
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/MFlixMusic.app"
          for f in "$APP/Contents/Resources/runtime/node-arm64" "$APP/Contents/Resources/runtime/node-x64"; do
            codesign --force --sign - --timestamp=none "$f"
            printf '%-40s %s\n' "$(basename "$f")" "$(codesign -dv "$f" 2>&1 | grep -m1 'Signature')"
          done
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          bash -n "$APP/Contents/MacOS/MFlixMusic"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"

      - name: 冒烟测试（真跑一次，等服务回 200）
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/MFlixMusic.app"
          MFLIX_NOBROWSER=1 "$APP/Contents/MacOS/MFlixMusic" > "$RUNNER_TEMP/launch.log" 2>&1 &
          LAUNCHER=$!
          ok=""
          for i in $(seq 1 60); do
            for p in $(seq 8090 8130); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 "http://127.0.0.1:${p}/" || true)
              if [ "$code" = "200" ]; then ok="port=$p"; PORT="$p"; break 2; fi
            done
            sleep 1
          done
          echo "--- launch.log ---"; cat "$RUNNER_TEMP/launch.log" || true
          echo "--- app log ---"; tail -n 30 "$HOME/Library/Logs/MFlixMusic/mflix-music.log" || true
          echo "--- 首页标题 ---"; curl -s --max-time 5 "http://127.0.0.1:${PORT}/" | grep -o '<title>[^<]*</title>' | head -1 || true
          echo "--- 接口 ---"; curl -s -o /dev/null -w "library=%{http_code}\n" --max-time 10 "http://127.0.0.1:${PORT}/api/library" || true
          pkill -f 'runtime/node-' || true
          pkill -f 'server.js' || true
          test -n "$ok"

      - name: 打 DMG
        env:
          VER: ${{ inputs.version }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/MFlixMusic.app"
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/MFlix Music.app"
          ln -s /Applications "$STAGE/应用程序"
          cat > "$STAGE/使用说明.txt" <<'README'
          MFlix Music · macOS 应用版使用说明
          ==================================

          一、怎么装
            1. 双击 MFlixMusic-macOS-*.dmg，弹出磁盘窗口。
            2. 把「MFlix Music.app」拖到左边的「应用程序」文件夹。
            3. 推出磁盘映像。

          二、第一次打开会被拦一次（没做 Apple 开发者签名，属正常）
            · 提示「无法打开，因为 Apple 无法验证」：
                在「MFlix Music.app」上右键 → 打开 → 再点「打开」。之后双击就正常。
            · 提示「已损坏，无法打开」：
                打开「终端」，执行
                  xattr -dr com.apple.quarantine /Applications/MFlix\ Music.app

          三、打开以后
            · 会自动起服务（默认 8090，占用了会往后找），并打开一个无地址栏的音乐窗口。
            · 右上角会弹通知：手机 / 电视用 http://<这台 Mac 的 IP>:8090 —— 地址已复制到剪贴板。
            · 图标常驻 Dock，退出（Cmd-Q）即停止服务。
            · 日志：~/Library/Logs/MFlixMusic/mflix-music.log

          四、支持哪些 Mac
            Apple 芯片与 Intel 都在同一个包里，启动时自动挑运行时。要求 macOS 11 及以上。
          README
          hdiutil create -volname "MFlix Music ${VER}" -fs HFS+ -srcfolder "$STAGE" \
            -ov -format UDZO -imagekey zlib-level=9 \
            "$RUNNER_TEMP/MFlixMusic-macOS-${VER}.dmg"
          hdiutil verify "$RUNNER_TEMP/MFlixMusic-macOS-${VER}.dmg"
          echo "== 挂载回读 =="
          MNT="$RUNNER_TEMP/mnt"
          hdiutil attach "$RUNNER_TEMP/MFlixMusic-macOS-${VER}.dmg" -mountpoint "$MNT" -nobrowse -readonly
          ls -la "$MNT"
          test -x "$MNT/MFlix Music.app/Contents/MacOS/MFlixMusic"
          test -x "$MNT/MFlix Music.app/Contents/Resources/runtime/node-arm64"
          test -f "$MNT/MFlix Music.app/Contents/Resources/payload/public/index.html"
          codesign --verify --strict "$MNT/MFlix Music.app"
          echo "== .app 结构判据 =="
          stat -f '%Sp %N' "$MNT/MFlix Music.app/Contents/MacOS/MFlixMusic"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$MNT/MFlix Music.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$MNT/MFlix Music.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$MNT/MFlix Music.app/Contents/Info.plist"
          plutil -lint "$MNT/MFlix Music.app/Contents/Info.plist"
          test -f "$MNT/MFlix Music.app/Contents/Resources/app.icns"
          echo "== 载荷与源码逐文件哈希 =="
          diff -r -q "$RUNNER_TEMP/work/MFlixMusic/public" "$MNT/MFlix Music.app/Contents/Resources/payload/public" && echo "public 与源码 0 差异"
          shasum -a 256 "$MNT/MFlix Music.app/Contents/Resources/payload/public/index.html" "$RUNNER_TEMP/work/MFlixMusic/public/index.html"
          echo "== 载荷文件数 =="; find "$MNT/MFlix Music.app/Contents/Resources/payload" -type f ! -name '._*' | wc -l | tr -d ' '
          du -sh "$MNT/MFlix Music.app"
          hdiutil detach "$MNT"

      # 用户要的是「装到 Mac 上当服务器跑」的那套：目录 + 启动.command，
      # 启动后打印局域网地址，电视/手机连过来。
      - name: 额外出服务端形态 DMG（目录 + 启动.command）
        env:
          VER: ${{ inputs.version }}
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/work/MFlixMusic"
          STAGE="$RUNNER_TEMP/serverstage"
          OUT="$STAGE/MFlixMusic-macOS"
          rm -rf "$STAGE"; mkdir -p "$OUT/runtime"
          xattr -cr "$P" || true
          cp -R "$P/server.js" "$P/package.json" "$P/src" "$P/public" "$P/node_modules" "$OUT/"
          cp "$RUNNER_TEMP/nodedl/node-arm64" "$RUNNER_TEMP/nodedl/node-x64" "$OUT/runtime/"
          chmod 755 "$OUT/runtime/node-arm64" "$OUT/runtime/node-x64"

          cat > "$OUT/启动MFlixMusic.command" <<'LAUNCH'
          #!/bin/bash
          # MFlix Music 服务端启动器（macOS，Intel / Apple 芯片通用）
          # 双击运行：在本机起音乐服务（默认 8090），并打印局域网地址给手机/电视用。
          # 关掉这个终端窗口＝停止服务。
          cd "$(dirname "$0")" || exit 1
          ROOT="$PWD"
          VERSION="__VER__"

          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then
            NODE="$ROOT/runtime/node-arm64"
            ARCHNAME="Apple 芯片（arm64）"
          else
            NODE="$ROOT/runtime/node-x64"
            ARCHNAME="Intel（x86_64）"
          fi

          chmod +x "$NODE" "$ROOT/启动MFlixMusic.command" 2>/dev/null
          if [ ! -x "$NODE" ]; then
            echo "找不到 Node 运行时：$NODE"
            echo "请重新下载完整安装包，别把文件单独拖出来。"
            read -r -p "按回车退出…" _
            exit 1
          fi
          # arm64 上未签名的二进制会被系统直接杀掉，先补一次 ad-hoc 签名
          if ! "$NODE" -v >/dev/null 2>&1; then
            command -v codesign >/dev/null 2>&1 && codesign --force --sign - "$NODE" >/dev/null 2>&1
          fi

          port_open() { /usr/bin/nc -z 127.0.0.1 "$1" >/dev/null 2>&1; }
          PORT=8090
          while port_open "$PORT" && [ "$PORT" -lt 8130 ]; do PORT=$((PORT+1)); done
          if [ "$PORT" -ge 8130 ]; then
            echo "8090 附近端口都被占了，先关掉占口的程序。"
            read -r -p "按回车退出…" _
            exit 1
          fi

          LANIP="$(ipconfig getifaddr en0 2>/dev/null || ipconfig getifaddr en1 2>/dev/null)"
          mkdir -p "$HOME/Library/Logs/MFlixMusic"
          LOG="$HOME/Library/Logs/MFlixMusic/mflix-music.log"

          echo "MFlix Music $VERSION · $ARCHNAME"
          echo "目录：$ROOT"
          echo "启动中，端口 $PORT，日志：$LOG"

          PORT="$PORT" "$NODE" server.js >> "$LOG" 2>&1 &
          PID=$!
          cleanup() {
            echo
            echo "正在停止…"
            kill "$PID" 2>/dev/null
            exit 0
          }
          trap cleanup INT TERM

          ok=""
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 "http://127.0.0.1:$PORT/" 2>/dev/null || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done

          if [ -z "$ok" ]; then
            echo "服务没起来，日志最后 20 行："
            tail -n 20 "$LOG" 2>/dev/null
            read -r -p "按回车退出…" _
            cleanup
          fi

          echo
          echo "────────────────────────────────────────────"
          echo " 本机：      http://127.0.0.1:$PORT/"
          if [ -n "$LANIP" ]; then
            echo " 局域网：    http://$LANIP:$PORT/"
            echo "            （同一 WiFi 的手机 / 平板 / 电视打开这个地址）"
          else
            echo " 局域网：    没读到本机 IP（Wi-Fi 没连上？），可在「系统设置 → 网络」里看。"
          fi
          echo " 停止：      关掉这个窗口，或按 Control-C"
          echo "────────────────────────────────────────────"

          open "http://127.0.0.1:$PORT/" >/dev/null 2>&1 || true
          wait "$PID"
          LAUNCH
          sed -i '' "s/__VER__/${VER}/" "$OUT/启动MFlixMusic.command"
          chmod 755 "$OUT/启动MFlixMusic.command"

          cat > "$OUT/使用说明.txt" <<'README'
          MFlix Music · macOS 服务端版使用说明
          =====================================

          一、这是什么
            这是「服务端」包：装在 Mac 上跑起来当服务器，手机 / 平板 / 电视用浏览器
            连过来听歌。不是 Mac 客户端 App，Mac 自己也是用浏览器打开。

          二、怎么装
            1. 双击 MFlixMusic-macOS-Server.dmg，会弹出一个磁盘窗口。
            2. 把里面的「MFlixMusic-macOS」文件夹拖到「应用程序」或任意位置（约 120MB）。
            3. 推出磁盘映像（右键桌面上的卷 → 推出）。
            4. 进那个文件夹，双击「启动MFlixMusic.command」。

          三、第一次打开会被拦一次（没做 Apple 开发者签名，属正常）
            · 提示「无法打开，因为 Apple 无法验证」：
                在「启动MFlixMusic.command」上右键 → 打开 → 再点「打开」。
            · 提示「已损坏，无法打开」：
                打开「终端」，执行
                  xattr -dr com.apple.quarantine /Applications/MFlixMusic-macOS
                （只针对这个文件夹，不改系统设置）

          四、启动后你会看到
            窗口里会打印：
              · 本机：    http://127.0.0.1:8090/
              · 局域网：  http://<这台 Mac 的 IP>:8090/   ← 电视/手机用这个
            同时会自动用默认浏览器打开本机地址。回到这个窗口按 Control-C 即停止服务。
            服务跑起来后，同一 WiFi 下的电视浏览器直接打开局域网地址就能听。

          五、端口与日志
            · 默认 8090；被占用会自动往后找（最多到 8130），窗口里会显示实际端口。
            · 日志：~/Library/Logs/MFlixMusic/mflix-music.log
            · 服务监听 0.0.0.0，所以局域网能连；Mac 防火墙弹窗请选「允许」。

          六、支持哪些 Mac
            · Apple 芯片（M1/M2/M3/M4）：走 runtime/node-arm64
            · Intel 芯片：走 runtime/node-x64
            同一个包里两套都在，启动时用 uname -m 自动挑。
            要求 macOS 11 及以上。

          七、常见问题
            · 双击没反应：在终端里手动跑 ./启动MFlixMusic.command，看报错。
            · 手机连不上：确认在同一个 WiFi；确认防火墙允许；确认用的是窗口里打印的局域网地址。
            · 想换端口：终端里执行 PORT=9000 ./启动MFlixMusic.command（脚本会优先用它）。
          README

          hdiutil create -volname "MFlix Music" -fs HFS+ -srcfolder "$STAGE" \
            -ov -format UDZO -imagekey zlib-level=9 \
            "$RUNNER_TEMP/MFlixMusic-macOS-Server.dmg"
          hdiutil verify "$RUNNER_TEMP/MFlixMusic-macOS-Server.dmg"

          echo "== 挂回读：权限位与结构 =="
          MNT="$RUNNER_TEMP/mnt2"
          hdiutil attach "$RUNNER_TEMP/MFlixMusic-macOS-Server.dmg" -mountpoint "$MNT" -nobrowse -readonly
          ls -l "$MNT/MFlixMusic-macOS"
          stat -f '%Sp %N' "$MNT/MFlixMusic-macOS/启动MFlixMusic.command"
          test -x "$MNT/MFlixMusic-macOS/启动MFlixMusic.command"
          test -x "$MNT/MFlixMusic-macOS/runtime/node-arm64"
          test -x "$MNT/MFlixMusic-macOS/runtime/node-x64"
          test -f "$MNT/MFlixMusic-macOS/public/index.html"
          test -d "$MNT/MFlixMusic-macOS/node_modules/pinyin-pro"
          bash -n "$MNT/MFlixMusic-macOS/启动MFlixMusic.command"
          echo "DMG 内文件数：$(find "$MNT" -type f ! -name '._*' | wc -l | tr -d ' ')"
          hdiutil detach "$MNT"
          ls -l "$RUNNER_TEMP/MFlixMusic-macOS-Server.dmg"

          echo "== 服务端形态冒烟：直接用 DMG 里的目录跑一次 =="
          SMOKE="$RUNNER_TEMP/smokecopy"
          rm -rf "$SMOKE"; mkdir -p "$SMOKE"
          cp -R "$OUT" "$SMOKE/"
          cd "$SMOKE/MFlixMusic-macOS"
          PORT=8091 "$PWD/runtime/node-x64" server.js > "$RUNNER_TEMP/smoke.log" 2>&1 &
          SPID=$!
          ok=""
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 "http://127.0.0.1:8091/" || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done
          curl -s --max-time 5 "http://127.0.0.1:8091/" | grep -o '<title>[^<]*</title>' | head -1 || true
          curl -s -o /dev/null -w "library=%{http_code}\n" --max-time 10 "http://127.0.0.1:8091/api/library" || true
          kill "$SPID" 2>/dev/null || true
          cat "$RUNNER_TEMP/smoke.log" | tail -n 10 || true
          test -n "$ok"

      - name: 汇总校验值
        env:
          VER: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          for F in "MFlixMusic-macOS-${VER}.dmg" "MFlixMusic-macOS-Server.dmg"; do
            printf '%-32s %12d  bytes  MD5 %s\n' "$F" "$(stat -f%z "$F")" "$(md5 -q "$F")" >> SUMS.txt
            shasum -a 256 "$F" >> SUMS.txt
          done
          cat SUMS.txt
          { echo '```'; cat SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: MFlixMusic-macOS
          path: |
            ${{ runner.temp }}/MFlixMusic-macOS-*.dmg
            ${{ runner.temp }}/MFlixMusic-macOS-Server.dmg
            ${{ runner.temp }}/SUMS.txt
          retention-days: 7

      # 交付通道走 Release 资产：artifact 下载要走 API 换票据，本机实测只有 ~25 KB/s，
      # 74 MB 要下半个多小时；Release 资产直链能跑到 10 MB/s 以上。
      - name: 传到 Release（DMG 交付直链）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="music-v${VER}"
          NOTE="MFlix Music ${VER} · macOS 安装包（DMG）

          · 双击挂载后把「MFlix Music.app」拖进「应用程序」
          · 首次打开若提示无法验证开发者：右键 → 打开（ad-hoc 签名，未做公证）
          · 启动后自动选空闲端口（8090 起）起服务，再用 Chrome/Edge 的无地址栏窗口打开；没有这两个浏览器就用默认浏览器
          · 日志：~/Library/Logs/MFlixMusic/mflix-music.log"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，直接覆盖资产"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "MFlix Music ${VER}（macOS）" --notes "$NOTE"
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/MFlixMusic-macOS-${VER}.dmg" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" "$RUNNER_TEMP/MFlixMusic-macOS-Server.dmg" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" "$RUNNER_TEMP/SUMS.txt" --clobber --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            -q '.assets[] | "\(.name)  \(.size)"'
